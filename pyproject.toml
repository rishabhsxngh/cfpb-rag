[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfpb-rag"
version = "0.1.0"
description = "Evaluated RAG + SQL-routing assistant over CFPB consumer complaints"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "anthropic>=0.40",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cfpb-rag = "cfpb_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfpb_rag = ["eval/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
